name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: attribution_test
          POSTGRES_PASSWORD: isolated_ci_password
          POSTGRES_DB: attribution_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U attribution_test -d attribution_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ATTRIBUTION_DATABASE_URL: postgresql+psycopg://attribution_test:isolated_ci_password@localhost:5432/attribution_test
      ATTRIBUTION_TEST_DATABASE_URL: postgresql+psycopg://attribution_test:isolated_ci_password@localhost:5432/attribution_test
      ATTRIBUTION_PUBLIC_ORIGIN: http://testserver
      ATTRIBUTION_SECURE_COOKIE: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.11'
      - run: uv sync --locked --extra test
      - run: uv run --locked --extra test python -B -m unittest discover -s tests -v
      - run: uv run --locked --extra test python run_integration.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build

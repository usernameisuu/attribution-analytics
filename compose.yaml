name: business-attribution
x-backend: &backend
  build: ./backend
  environment:
    ATTRIBUTION_DATABASE_URL: postgresql+psycopg://attribution:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@database:5432/attribution
    ATTRIBUTION_PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
    ATTRIBUTION_SECURE_COOKIE: ${SECURE_COOKIE:-true}
  depends_on:
    database:
      condition: service_healthy
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: attribution
      POSTGRES_USER: attribution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attribution -d attribution"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    profiles: ["setup"]
  bootstrap:
    <<: *backend
    environment:
      ATTRIBUTION_DATABASE_URL: postgresql+psycopg://attribution:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@database:5432/attribution
      BOOTSTRAP_USERNAME: ${BOOTSTRAP_USERNAME:-analyst}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?Set BOOTSTRAP_PASSWORD}
    command: ["python", "-m", "app.bootstrap"]
    profiles: ["setup"]
  api:
    <<: *backend
    restart: unless-stopped
  web:
    build: ./frontend
    ports: ["127.0.0.1:8080:8080"]
    depends_on: ["api"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
volumes:
  postgres_data:
